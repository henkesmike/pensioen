<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regelingen beheren · Pensioen ontdekt</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#26332e;font:16px/1.5 system-ui,sans-serif}
header,main,footer{width:min(920px,100%);margin:auto;padding:24px}
header{border-bottom:1px solid #e1e5e2;display:flex;align-items:center;gap:12px}
header a{color:#28695d;text-decoration:none;font-size:15px}
header strong{font-size:20px;font-weight:700}
h1{font-size:30px;line-height:1.2;margin:32px 0 8px}
.intro{color:#56635d;margin:0 0 26px}
.parameters{border-top:1px solid #dce2de}
.parameter{display:grid;grid-template-columns:minmax(240px,1fr) minmax(160px,240px);gap:24px;align-items:center;padding:18px 4px;border-bottom:1px solid #dce2de}
.parameter label{font-weight:600}
.parameter input{width:100%;font:inherit;color:inherit;padding:10px 12px;border:1px solid #aeb9b2;border-radius:6px;background:#fff}
.actions{display:flex;gap:12px;margin-top:26px}
button{font:inherit;border-radius:6px;padding:10px 18px;cursor:pointer}
.save{background:#28695d;border:1px solid #28695d;color:#fff;font-weight:650}
.cancel{background:#fff;border:1px solid #aeb9b2;color:#29352f}
button:disabled{opacity:.55;cursor:wait}
#status{min-height:1.5em;margin-top:18px;color:#8a381d;font-weight:600}
footer{margin-top:40px;border-top:1px solid #e1e5e2;color:#66716b;font-size:14px}
@media(max-width:620px){header,main,footer{padding:18px}.parameter{grid-template-columns:1fr;gap:8px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header><a href="/" aria-label="Terug naar Pensioen ontdekt">← Pensioen ontdekt</a><strong>Beheer regelingen</strong></header>
<main>
<h1>Regeling definiëren</h1>
<p class="intro">Pas de invoerparameters aan. Na bewaren worden de regeling en de bijbehorende voice-over direct opgebouwd.</p>
<form id="regulation-form">
<div class="parameters">
<div class="parameter"><label for="months">Aantal maanden voorlopige dekking</label><input id="months" name="months" type="number" min="1" max="120" step="1" value="3" required></div>
<div class="parameter"><label for="percentage">Dekkingspercentage partnerpensioen</label><input id="percentage" name="percentage" type="number" min="1" max="100" step="1" value="40" required></div>
</div>
<div class="actions"><button class="save" id="save" type="submit">Bewaren</button><button class="cancel" id="cancel" type="button">Annuleren</button></div>
<p id="status" role="status" aria-live="polite"></p>
</form>
</main>
<footer>Pensioen ontdekt · Beheer regelingen</footer>
<script>
if(sessionStorage.getItem('regelingbeheer-toegang')!=='ja'){
  location.replace('/');
}else{
  sessionStorage.removeItem('regelingbeheer-toegang');
  const form=document.getElementById('regulation-form');
  const status=document.getElementById('status');
  const save=document.getElementById('save');
  document.getElementById('cancel').addEventListener('click',()=>location.replace('/'));
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(!form.reportValidity()) return;
    save.disabled=true;
    document.getElementById('cancel').disabled=true;
    status.style.color='#46574d';
    status.textContent='Regeling wordt opgeslagen en de voice-over wordt direct gegenereerd…';
    try{
      const values=Object.fromEntries(new FormData(form));
      const response=await fetch('/api/regelingen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({months:Number(values.months),percentage:Number(values.percentage)})});
      const job=await response.json();
      if(!response.ok) throw new Error(job.error||'De aanvraag kon niet worden gestart.');
      const deadline=Date.now()+10*60*1000;
      while(Date.now()<deadline){
        await new Promise(resolve=>setTimeout(resolve,2000));
        const check=await fetch('/api/regelingen/jobs/'+encodeURIComponent(job.id),{cache:'no-store'});
        const state=await check.json();
        if(!check.ok) throw new Error(state.error||'De voortgang kon niet worden opgehaald.');
        if(state.state==='failed') throw new Error(state.error||'De voice-over kon niet worden gemaakt.');
        if(state.state==='preview-ready'){
          sessionStorage.setItem('regelingbeheer-resultaat',JSON.stringify({code:state.code,preview_url:state.preview_url}));
          location.replace('/');
          return;
        }
      }
      throw new Error('De aanvraag duurt langer dan verwacht. Vernieuw de pagina en probeer het later opnieuw.');
    }catch(error){
      status.style.color='#8a381d';
      status.textContent=error.message||'Er ging iets mis. Probeer het later opnieuw.';
      save.disabled=false;
      document.getElementById('cancel').disabled=false;
    }
  });
}
</script>
</body>
</html>
