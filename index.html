<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pensioen ontdekt</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fcfbf8;color:#254b43;font:17px/1.55 system-ui,sans-serif}
    header,main,footer{max-width:1000px;margin:auto;padding:24px}
    header strong{font-size:23px}
    main{min-height:75vh;display:flex;align-items:center}
    .hero{width:100%;background:#e7eee7;border-radius:24px;padding:clamp(28px,7vw,64px)}
    h1{font-size:clamp(36px,6vw,58px);line-height:1.1;margin:0 0 18px}
    p{max-width:680px;margin:0 0 26px}
    .button{display:inline-block;background:#28695d;color:white;text-decoration:none;border-radius:10px;padding:14px 22px;font-weight:650}
    .button:hover{background:#1e554b}
    a:focus-visible{outline:3px solid #a56b35;outline-offset:3px}
    footer{border-top:1px solid #d8e1da;font-size:14px}
    @media(max-width:600px){header,main,footer{padding:16px}}
  </style>
</head>
<body>
  <header><strong>◈ Pensioen ontdekt</strong></header>
  <main>
    <section class="hero">
      <h1>Begrijp jouw pensioen.</h1>
      <p>Ontdek in het filmpje hoe partnerpensioen werkt en wat er voor je partner geregeld kan zijn.</p>
      <a class="button" href="/partnerpensioen-demo.html">Bekijk het filmpje over partnerpensioen</a>
    </section>
  </main>
  <footer>Pensioen ontdekt · Prototype v0.1 · Fictieve regeling</footer>
</body>
</html>
