<script>
const element = id => document.getElementById(id);
const clamp = number => Math.max(0, Math.min(1, number));
const phase = (time, from, to) => clamp((time - from) / (to - from));
const ease = t => t * t * (3 - 2 * t);
const payoutStart = 49;
const captions = [
    [3.5, 7.4, 'Via je werkgever bouw je ouderdomspensioen op.'],
    [7.8, 12.2, 'Je bouwt in de loop van de tijd steeds meer pensioen op.'],
    [12.5, 19.2, 'Als je trouwt of een geregistreerd partnerschap aangaat, begint een nieuwe opbouwperiode.'],
    [19.5, 31.2, 'Je bouwt in die periode gewoon verder pensioen op, net als daarvoor. Het nieuwe deel is de pensioenopbouw tijdens jullie huwelijk of geregistreerd partnerschap.'],
    [31.5, 41.5, 'Als je gaat scheiden, heeft je ex-partner recht op een deel van het ouderdomspensioen dat je tijdens het huwelijk of geregistreerd partnerschap hebt opgebouwd.'],
    [41.8, 48.8, 'Bij de standaardverdeling heeft je ex-partner recht op de helft van dit deel van het ouderdomspensioen.'],
    [payoutStart, 59, 'Als je de scheiding binnen twee jaar meldt, zorgt het pensioenfonds voor de uitbetaling.'],
];
for (const [source, target] of [['partner', 'partner-share'], ['participant', 'participant-share']]) {
    element(target).setAttribute('href', element(source).querySelector('image').getAttribute('href'));
}
const coins = Array.from(element('coins').children);
let time = 0;
function render() {
    const shrink = ease(phase(time, 4.6, 6.8));
    const scale = 1 - .70 * shrink;
    const before = 250 * phase(time, 6.8, 12.5);
    const during = 310 * phase(time, 19.5, 31);
    const edge = 120 + before + during;
    const couple = ease(phase(time, 12.5, 13.3));
    const originalParticipantX = 575 + (edge - 18 * couple - 575) * shrink;
    const separation = ease(phase(time, 31.6, 33.8));
    const originalPartnerX = edge + 18 + 48 * separation;
    const splitTime = payoutStart;
    const split = ease(phase(time, splitTime, 57));
    const separating = time >= splitTime;
    const blockScale = 1 - .32 * split;
    const participantDrop = 281 * (1 - blockScale);
    const partnerDrop = (281 - 196 * .68) * split;
    const leftOffset = -20 * split;
    const rightOffset = 255 * split;
    const participantX = originalParticipantX + (252 - originalParticipantX) * split;
    const partnerX = originalPartnerX + (612 - originalPartnerX) * split;
    element('participant-block').setAttribute('transform', `translate(${leftOffset} ${participantDrop}) scale(${blockScale})`);
    element('partner-block').setAttribute('transform', `translate(${rightOffset} ${partnerDrop}) scale(${blockScale})`);
    element('separated-blocks').setAttribute('visibility', separating ? 'visible' : 'hidden');
    for (const id of ['before', 'during', 'block-frame', 'block-track']) {
        element(id).setAttribute('visibility', separating ? 'hidden' : 'visible');
    }
    element('period-divider').style.opacity = separating ? 0 : couple;
    const participantY = 345 + 63 * shrink;
    const employerScale = 1 - .57 * shrink;
    element('card').style.opacity = 1 - phase(time, 2.9, 3.4);
    element('employer').setAttribute('transform',
        `translate(${45 - 29 * shrink} ${155 - 129 * shrink}) scale(${employerScale})`);
    element('marriage-label').style.opacity = separating ? 0 : couple;
    element('divorce-label').style.opacity = separating ? 0 : phase(time, 31, 31.5);
    const building = (time >= 6.8 && time < 12.5) || (time >= 19.5 && time < 31);
    element('coins').style.opacity = Number(building);
    coins.forEach((coin, index) => {
        const travel = (time / 1.55 + index / coins.length) % 1;
        coin.setAttribute('cx', 73 + (Math.max(121, edge - 6) - 73) * travel);
        coin.setAttribute('cy', 67 + 66 * travel - 37 * 4 * travel * (1 - travel));
        coin.style.opacity = Math.min(1, travel * 10, (1 - travel) * 10);
    });
    element('participant').setAttribute('transform',
        `translate(${participantX} ${participantY}) scale(${scale}) translate(-575 -345)`);
    element('partner').setAttribute('transform',
        `translate(${partnerX} 408) scale(.30) translate(-700 -345)`);
    element('partner').style.opacity = couple;
    element('division').style.opacity = separating ? 0 : phase(time, 41.8, 42.5);
    const shareOpacity = phase(time, 42.5, 43.2);
    for (const id of ['partner-share', 'participant-share']) element(id).style.opacity = shareOpacity;
    element('timeline').style.opacity = phase(time, 5.8, 6.7);
    element('before').setAttribute('width', before);
    element('during').setAttribute('width', during);
    const cue = captions.find(([start, end]) => time >= start && time <= end);
    element('caption').textContent = cue?.[2] ?? '';
}
const recording = element('recording');
const anchors = [[0, 0], [3.5, 3.5], [7.563, 7.8], [11.627, 12.5], [18.175, 19.5], [30.76, 31.5], [42.37, 41.8], [51.403, 49.0], [57.463, 59], [62.463, 64]];
let frame;
function drawFromAudio() {
    const seconds = recording.currentTime;
    const index = anchors.findIndex(([start]) => start > seconds);
    if (index > 0) {
        const [from, first] = anchors[index - 1];
        const [to, last] = anchors[index];
        time = first + (last - first) * phase(seconds, from, to);
    } else {
        time = 64;
    }
    render();
}
function tick() {
    drawFromAudio();
    if (!recording.paused && !recording.ended) frame = requestAnimationFrame(tick);
}
recording.addEventListener('play', () => {
    cancelAnimationFrame(frame);
    tick();
});
recording.addEventListener('pause', () => cancelAnimationFrame(frame));
recording.addEventListener('seeked', drawFromAudio);
recording.addEventListener('ended', () => { time = 64; render(); });
