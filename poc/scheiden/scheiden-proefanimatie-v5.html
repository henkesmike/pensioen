<div id="card" aria-hidden="true">Wat betekent scheiden voor je pensioen?</div></div>
<p id="caption"></p>
<div class="controls">
<button id="play" type="button">Afspelen</button>
<button id="restart" type="button">Opnieuw</button>
<label id="sound"><input id="voice" type="checkbox" checked> Voorleesstem</label>
<input id="progress" type="range" min="0" max="49" step="0.1" value="0" aria-label="Afspeelpositie">
<small id="status" role="status"></small>
</div>
</main>
<script>
const element = id => document.getElementById(id);
const clamp = number => Math.max(0, Math.min(1, number));
const phase = (time, from, to) => clamp((time - from) / (to - from));
const ease = t => t * t * (3 - 2 * t);
const captions = [
    [3.5, 7.4, 'Je werkt. Via je werkgever bouw je ouderdomspensioen op.'],
    [7.8, 12.2, 'Je bouwt in de loop van de tijd steeds meer pensioen op.'],
    [12.5, 18.4, 'Op dit moment trouw je of ga je een geregistreerd partnerschap aan.'],
    [18.5, 25.4, 'Je bouwt verder pensioen op. Het groene deel laat zien wat je in deze periode opbouwt.'],
    [25.7, 33.3, 'Als je gaat scheiden, kan je ex-partner recht hebben op een deel van het ouderdomspensioen dat je tijdens jullie huwelijk hebt opgebouwd.'],
    [33.6, 42.5, 'Bij de standaardverdeling heeft je ex-partner recht op de helft van het ouderdomspensioen dat je tijdens het huwelijk hebt opgebouwd.'], 
];
for (const [source, target] of [['partner', 'partner-share'], ['participant', 'participant-share']]) {
    element(target).setAttribute('href', element(source).querySelector('image').getAttribute('href'));
}
const coins = Array.from(element('coins').children);
const duration = Number(element('progress').max);
const speaker = window.speechSynthesis;
let time = 0;
let playing = false;
let previousFrame = 0;
let pendingFrame;
let lastCue = null;
const dutchVoice = () => speaker?.getVoices().find(voice => /^nl(?:-|_|$)/i.test(voice.lang));
function render() {
    const shrink = ease(phase(time, 4.6, 6.8));
    const scale = 1 - .70 * shrink;
    const before = 250 * phase(time, 6.8, 12.5);
    const during = 310 * phase(time, 18.5, 25);
    const edge = 120 + before + during;
    const couple = ease(phase(time, 12.5, 13.3));
    const originalParticipantX = 575 + (edge - 18 * couple - 575) * shrink;
    const separation = ease(phase(time, 26, 28.2));
    const originalPartnerX = edge + 18 + 48 * separation;
    const splitTime = 43;
    const split = ease(phase(time, splitTime, 47));
    const separating = time >= splitTime;
    const blockScaleX = 1 - .32 * split;
    const leftOffset = -20 * split;
    const rightOffset = 255 * split;
    const participantX = originalParticipantX + (252 - originalParticipantX) * split;
    const partnerX = originalPartnerX + (612 - originalPartnerX) * split;
    element('participant-block').setAttribute('transform', `translate(${leftOffset} 0) scale(${blockScaleX} 1)`);
    element('partner-block').setAttribute('transform', `translate(${rightOffset} ${85 * phase(split, .84, 1)}) scale(${blockScaleX} 1)`);
    element('separated-blocks').setAttribute('visibility', separating ? 'visible' : 'hidden');
    for (const id of ['before', 'during', 'block-frame', 'block-track']) {
        element(id).setAttribute('visibility', separating ? 'hidden' : 'visible');
    }
    element('period-divider').style.opacity = separating ? 0 : couple;
    const participantY = 345 + 63 * shrink;
    const employerScale = 1 - .57 * shrink;
    element('card').style.opacity = 1 - phase(time, 2.9, 3.4);
    element('employer').setAttribute('transform',
        `translate(${45 - 29 * shrink} ${155 - 129 * shrink}) scale(${employerScale})`);
    element('marriage-label').style.opacity = separating ? 0 : couple;
    element('divorce-label').style.opacity = separating ? 0 : phase(time, 25, 25.5);
    const building = (time >= 6.8 && time < 12.5) || (time >= 18.5 && time < 25);
    element('coins').style.opacity = Number(building);
    coins.forEach((coin, index) => {
        const travel = (time / 1.55 + index / coins.length) % 1;
        coin.setAttribute('cx', 73 + (Math.max(121, edge - 6) - 73) * travel);
        coin.setAttribute('cy', 67 + 66 * travel - 37 * 4 * travel * (1 - travel));
        coin.style.opacity = Math.min(1, travel * 10, (1 - travel) * 10);
    });
    element('participant').setAttribute('transform',
        `translate(${participantX} ${participantY}) scale(${scale}) translate(-575 -345)`);
    element('partner').setAttribute('transform',
        `translate(${partnerX} 408) scale(.30) translate(-700 -345)`);
    element('partner').style.opacity = couple;
    element('division').style.opacity = separating ? 0 : phase(time, 33.6, 34.3);
    const shareOpacity = phase(time, 34.3, 35);
    for (const id of ['partner-share', 'participant-share']) element(id).style.opacity = shareOpacity;
    element('timeline').style.opacity = phase(time, 5.8, 6.7);
    element('before').setAttribute('width', before);
    element('during').setAttribute('width', during);
    element('progress').value = time;
    const cue = captions.find(([start, end]) => time >= start && time <= end);
    element('caption').textContent = cue?.[2] ?? '';
    if (cue === lastCue) return;
    lastCue = cue;
    if (playing && cue && element('voice').checked) {
        const voice = dutchVoice();
        if (voice) {
            speaker.cancel();
            const line = new SpeechSynthesisUtterance(cue[2]);
            line.voice = voice;
            line.lang = voice.lang;
            line.rate = 1.03;
            speaker.speak(line);
        } else {
            element('status').textContent = 'Geen Nederlandse voorleesstem beschikbaar. De tekst blijft in beeld.';
        }
    }
}
function pause() {
    playing = false;
    cancelAnimationFrame(pendingFrame);
    speaker?.cancel();
    element('play').textContent = time >= duration ? 'Opnieuw afspelen' : 'Afspelen';
}
function frame(now) {
    if (!playing) return;
    if (previousFrame) time = Math.min(duration, time + (now - previousFrame) / 1000);
    previousFrame = now;
    render();
    if (time >= duration) pause();
    else pendingFrame = requestAnimationFrame(frame);
}
function play() {
    if (playing) return;
    if (time >= duration) time = 0;
    previousFrame = 0;
    lastCue = null;
    playing = true;
    element('play').textContent = 'Pauzeren';
    pendingFrame = requestAnimationFrame(frame);
}
element('play').addEventListener('click', () => playing ? pause() : play());
element('restart').addEventListener('click', () => {
    time = 0;
    speaker?.cancel();
    render();
    play();
});
element('progress').addEventListener('input', event => {
    speaker?.cancel();
    time = Number(event.target.value);
    lastCue = null;
    render();
});
element('voice').addEventListener('change', () => {
    speaker?.cancel();
    element('status').textContent = '';
});
render();
</script>
</html>
